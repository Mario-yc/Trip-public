[project]
name = "trip-backend"
version = "0.1.0"
description = "Backend API for the AI travel planner demo"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
trip-agent = "src.cli.agent_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
search = [
    "ddgs>=9.0.0; python_version >= '3.10'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [
    ".pytest_cache",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
# Start with syntax/undefined-name/import-critical rules only. Broader style rules
# should be enabled after the MVP dirty worktree is split into reviewable PRs.
select = ["E9", "F63", "F7", "F82"]

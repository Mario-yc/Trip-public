name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DEEPSEEK_API_KEY: ""
      DEEPSEEK_MODEL: deepseek-chat
      MAP_PROVIDER_KEY: ""
      MAP_JS_API_KEY: ""
      MAP_PROVIDER_SECURITY_JS_CODE: ""
      PROVIDER_MODE: mock
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"

      - name: Backend tests
        timeout-minutes: 20
        run: python -m pytest backend/tests -q --tb=short -p no:cacheprovider

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        timeout-minutes: 4
        working-directory: frontend
        run: npm test -- --run --reporter=verbose

      - name: Frontend build
        timeout-minutes: 4
        working-directory: frontend
        run: npm run build

      - name: Backend lint
        timeout-minutes: 3
        run: python -m ruff check backend/src backend/tests

      - name: Frontend lint
        timeout-minutes: 3
        working-directory: frontend
        run: npm run lint

      - name: Frontend format check
        timeout-minutes: 2
        working-directory: frontend
        run: npm run format:check
